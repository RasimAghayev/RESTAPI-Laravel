# Phase 5 container baseline — docker-compose for RESTAPI-Laravel
# COMPOSE_PROJECT_NAME=RESTAPI-Laravel-p5 ; ports from the reserved block 20110-20119 (projects/info/state/ports.md)
name: restapi-laravel-p5

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: restapi-laravel-p5-app:local
    container_name: restapi-laravel-p5-app
    expose:
      - "9000"
    env_file:
      - customer-invoice-api/.env.example
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - LOG_CHANNEL=stack
      - CACHE_DRIVER=array
      - SESSION_DRIVER=array
      - QUEUE_CONNECTION=sync
      - MAIL_MAILER=array
    depends_on:
      db:
        condition: service_healthy
    networks:
      - restapi-laravel-p5

  web:
    image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    container_name: restapi-laravel-p5-web
    ports:
      - "20110:80"
    volumes:
      - ./customer-invoice-api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - restapi-laravel-p5

  db:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a2a6e0108f7ea71b0902
    container_name: restapi-laravel-p5-db
    ports:
      - "20111:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=laravel
      - MYSQL_DATABASE=laravel
      - MYSQL_USER=laravel
      - MYSQL_PASSWORD=laravel
    volumes:
      - restapi-laravel-p5-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - restapi-laravel-p5

volumes:
  restapi-laravel-p5-db-data:

networks:
  restapi-laravel-p5:
    driver: bridge