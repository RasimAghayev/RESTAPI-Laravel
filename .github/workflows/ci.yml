name: CI

on:
  push:
    branches: [master, test]
  pull_request:
    branches: [master, test]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gates:
    name: Docker quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build and test (Docker test stage)
        run: make test

      - name: Build runtime image
        run: make build

      - name: Lint (Pint)
        run: docker run --rm restapi-laravel-p5-test:local vendor/bin/pint --test

      - name: Dependency audit (Composer, best effort)
        continue-on-error: true
        run: docker run --rm restapi-laravel-p5-test:local composer audit --no-interaction --abandoned=report

      - name: Security scan (image, best effort)
        continue-on-error: true
        run: make security